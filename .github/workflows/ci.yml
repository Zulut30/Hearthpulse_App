# Builds every project and runs the tests on each push to main and each pull request (Windows, Linux, macOS).
# Releases (installers) are made by release.yml when a version tag like v0.8.0 is pushed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  scripts:
    name: Pool API and skill scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pool API validation
        run: node --test server/pool/test/validation.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install skill test dependencies
        run: python -m pip install Pillow PyYAML
      - name: Skill script tests
        run: python -B -I -m unittest discover -s tools/skill_checks -v

  windows:
    name: Windows (whole solution, WPF app included)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # C: on the hosted Windows runners is slow and scanned by Defender on every write: the SQLite-heavy tests took
      # 1.5-2.5 min there against 15 s on Linux. Temp files and NuGet packages go to D: and are left out of scanning.
      # (No NuGet cache: unpacking it took as long as restoring from nuget.org.)
      - name: Fast temp and package folders
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'tmp'
          $nuget = Join-Path $env:RUNNER_TEMP 'nuget'
          New-Item -ItemType Directory -Force $temp, $nuget | Out-Null
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, 'C:\Program Files\dotnet' -ErrorAction SilentlyContinue
          "TEMP=$temp", "TMP=$temp", "NUGET_PACKAGES=$nuget" | Add-Content $env:GITHUB_ENV
      # The image already has a .NET 10 SDK; downloading another one cost ~40 s. Install only when it is missing.
      - name: Installed .NET SDK
        id: sdk
        shell: bash
        run: |
          dotnet --list-sdks || true
          if dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then echo "have10=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-dotnet@v4
        if: steps.sdk.outputs.have10 != 'true'
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Hearthpulse.slnx --source https://api.nuget.org/v3/index.json
      - name: Build
        run: dotnet build Hearthpulse.slnx --no-restore -c Release
      # One after the other: run together on the 2-core runner, the presentation tests' 10 s waits timed out.
      - name: Tests
        run: dotnet test tests/Hearthpulse.Tests/Hearthpulse.Tests.csproj --no-build -c Release --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: WPF and Avalonia presentation contracts
        run: dotnet test tests/Hearthpulse.Presentation.Tests/Hearthpulse.Presentation.Tests.csproj --no-build -c Release --logger "trx;LogFileName=presentation.trx" --results-directory TestResults
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults

  # Linux and macOS: the tests, then the self-contained app as the installers ship it (native SQLite, Skia, HarfBuzz for
  # the runtime identifier), started for real with an empty data folder: windows, tray, overlay platform, card data.
  linux:
    name: Linux (cross-platform app, tests and a real start)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The WPF app targets Windows only; the Avalonia app and the tests cover Linux.
      - name: Publish the cross-platform app (linux-x64)
        run: dotnet publish src/Hearthpulse.Desktop/Hearthpulse.Desktop.csproj -c Release -r linux-x64 --self-contained -o publish
      - name: Tests
        run: dotnet test tests/Hearthpulse.Tests/Hearthpulse.Tests.csproj -c Release
      - name: Start the app
        shell: bash
        timeout-minutes: 4
        run: |
          command -v xvfb-run >/dev/null || sudo apt-get install -y --no-install-recommends xvfb
          export HEARTHPULSE_DATA="$RUNNER_TEMP/hearthpulse-data"
          xvfb-run -a ./publish/Hearthpulse --smoke-test | tee smoke.txt
          grep -q "start-up done" smoke.txt
      - name: App log
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/hearthpulse-data/hearthpulse.log" 2>/dev/null || echo "no log"

  macos:
    name: macOS (cross-platform app, tests and a real start)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish the cross-platform app (osx-arm64)
        run: dotnet publish src/Hearthpulse.Desktop/Hearthpulse.Desktop.csproj -c Release -r osx-arm64 --self-contained -o publish
      - name: Tests
        run: dotnet test tests/Hearthpulse.Tests/Hearthpulse.Tests.csproj -c Release
      - name: Start the app
        shell: bash
        timeout-minutes: 4
        run: |
          export HEARTHPULSE_DATA="$RUNNER_TEMP/hearthpulse-data"
          ./publish/Hearthpulse --smoke-test | tee smoke.txt
          grep -q "start-up done" smoke.txt
      - name: App log
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/hearthpulse-data/hearthpulse.log" 2>/dev/null || echo "no log"
