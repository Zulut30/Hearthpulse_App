# Builds every installer and publishes them as a GitHub Release.
# Push a tag like v0.2.0, or run it by hand from the Actions tab with a version number.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and publish (for example 0.2.0)
        required: true
        default: "0.15.0"
      publish:
        description: Publish the GitHub Release (off - a trial run - builds and checks every installer, publishes nothing)
        type: boolean
        default: true
      simulate_previous:
        description: Trial runs only - stand in a previous release with a manifest, so the delta package is built and checked
        type: boolean
        default: false
      sign_selftest:
        description: Trial runs only - sign with throwaway keys (Authenticode throwaway CA and .pfx, Ed25519 for SHA256SUMS.txt) and show the result
        type: boolean
        default: false

# Read-only by default: the build jobs see the signing secrets and never need to write. Only "release" publishes.
permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # Runs next to the installer builds, not before them; the release still waits for it.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      # Always, even when CI passed on this commit: a documentation-only push skips CI's .NET steps, so its green CI says
      # nothing about the code. Beside the installer builds, not on their critical path.
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Tests
        run: dotnet test tests/Hearthpulse.Tests/Hearthpulse.Tests.csproj

  # Every installer family on its own runner at the same time (they used to run one after another in one job).
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: Windows setup and portable
            id: windows-app
            os: ubuntu-latest
            apt: nsis zip
            build: installer/windows/build.sh "$V" app
          - name: Windows preview
            id: windows-preview
            os: ubuntu-latest
            apt: zip
            build: installer/windows/build.sh "$V" preview
          - name: Linux x64 packages
            id: linux-x64
            os: ubuntu-latest
            apt: rpm
            appimage: true
            build: installer/linux/build.sh "$V" x64
          - name: Linux arm64 packages
            id: linux-arm64
            os: ubuntu-latest
            apt: rpm
            appimage: true
            build: installer/linux/build.sh "$V" arm64
          - name: macOS installers
            id: macos
            os: macos-latest
            build: installer/macos/build.sh "$V" arm64 x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          SIMULATE: ${{ inputs.simulate_previous }}
          SELFTEST: ${{ inputs.sign_selftest }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="$GITHUB_REF_NAME"; else v="$INPUT_VERSION"; fi
          v="${v#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::The version must look like 0.2.0 (got '$v')"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$SIMULATE" = "true" ] && [ "$PUBLISH" != "false" ]; then
            echo "::error::simulate_previous is for trial runs: set publish to false"; exit 1
          fi
          if [ "$SELFTEST" = "true" ] && [ "$PUBLISH" != "false" ]; then
            echo "::error::sign_selftest is for trial runs: set publish to false"; exit 1
          fi
      - name: Packaging tools
        if: matrix.apt
        env:
          APT: ${{ matrix.apt }}
          APPIMAGE: ${{ matrix.appimage }}
          # The signing selftest shows each signer with osslsigncode (Windows jobs only).
          SELFTEST_TOOLS: ${{ inputs.sign_selftest && startsWith(matrix.id, 'windows') && 'osslsigncode' || '' }}
        run: |
          APT="$APT $SELFTEST_TOOLS"
          # The image's package lists usually still resolve; refreshing them first cost up to ~35 s. Refresh only on failure.
          # shellcheck disable=SC2086
          sudo apt-get install -y -qq $APT || { sudo apt-get update -qq && sudo apt-get install -y -qq $APT; }
          if [ "$APPIMAGE" = "true" ]; then
            curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x appimagetool
            sudo mv appimagetool /usr/local/bin/appimagetool
          fi
      - name: Build
        env:
          V: ${{ steps.v.outputs.version }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # installer/windows/previous.sh asks for the previous release's manifest (delta package).
          GH_TOKEN: ${{ github.token }}
          SIMULATE_PREVIOUS: ${{ inputs.simulate_previous }}
          # A publishing run (tag or publish=true) fails on any signing problem when signing secrets are set.
          PUBLISHING: ${{ github.event_name == 'push' || inputs.publish }}
          # Authenticode (installer/windows/sign.sh): a .pfx, else Azure Trusted Signing, else unsigned with a warning.
          # Only the Windows jobs see the secrets.
          SIGN_SELFTEST: ${{ startsWith(matrix.id, 'windows') && inputs.sign_selftest || '' }}
          WINDOWS_SIGN_PFX: ${{ startsWith(matrix.id, 'windows') && secrets.WINDOWS_SIGN_PFX || '' }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ startsWith(matrix.id, 'windows') && secrets.WINDOWS_SIGN_PFX_PASSWORD || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ startsWith(matrix.id, 'windows') && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ startsWith(matrix.id, 'windows') && secrets.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_SIGNING_PROFILE: ${{ startsWith(matrix.id, 'windows') && secrets.AZURE_SIGNING_PROFILE || '' }}
          AZURE_TENANT_ID: ${{ startsWith(matrix.id, 'windows') && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ startsWith(matrix.id, 'windows') && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ startsWith(matrix.id, 'windows') && secrets.AZURE_CLIENT_SECRET || '' }}
        run: ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          if-no-files-found: error
          # Every file is already compressed (exe/zip/dmg/pkg/deb/rpm/tar.gz/AppImage): zipping again only costs time.
          compression-level: 0
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.dmg
            dist/*.pkg
            dist/*.json
            dist/work/delta-previous.txt

  release:
    name: Publish the release
    needs: [tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          SELFTEST: ${{ inputs.sign_selftest }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="$GITHUB_REF_NAME"; else v="$INPUT_VERSION"; fi
          v="${v#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::The version must look like 0.2.0 (got '$v')"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$SELFTEST" = "true" ] && [ "$PUBLISH" != "false" ]; then
            echo "::error::sign_selftest is for trial runs: set publish to false"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The build scripts skip a format they cannot make (useful locally); a release must not.
      - name: Check every installer was built
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          # Delta updates: this version's manifest always; the delta package exactly when the previous release has a
          # manifest (none for 0.14.0 and older). 23 files without a delta, 24 with one, SHA256SUMS.txt included;
          # one more with SHA256SUMS.txt.sig ("Sign the checksums").
          # The Windows job found the previous release once (installer/windows/previous.sh) and says which.
          test -f dist/work/delta-previous.txt || { echo "::error::the Windows job did not say which delta it made"; exit 1; }
          prev="$(cat dist/work/delta-previous.txt)"
          rm -rf dist/work
          test -s "dist/Hearthpulse-Files-$V-win-x64.json" || { echo "::error::the manifest was not built"; exit 1; }
          deltas=$(find dist -maxdepth 1 -name 'Hearthpulse-Delta-*-win-x64.zip' | wc -l)
          if [ -n "$prev" ]; then
            test -s "dist/Hearthpulse-Delta-$prev-$V-win-x64.zip" && [ "$deltas" -eq 1 ] || { echo "::error::expected exactly the delta $prev -> $V"; exit 1; }
            echo "expected=24" >> "$GITHUB_ENV"
          else
            [ "$deltas" -eq 0 ] || { echo "::error::a delta package without a previous manifest"; exit 1; }
            echo "expected=23" >> "$GITHUB_ENV"
          fi
          for f in "Hearthpulse-Setup-$V-win-x64.exe" "Hearthpulse-Portable-$V-win-x64.zip" "Hearthpulse-Preview-$V-win-x64.zip"                    "hearthpulse_${V}_amd64.deb" "hearthpulse_${V}_arm64.deb"                    "hearthpulse-$V-1.x86_64.rpm" "hearthpulse-$V-1.aarch64.rpm"                    "Hearthpulse-$V-linux-x64.tar.gz" "Hearthpulse-$V-linux-arm64.tar.gz"                    "Hearthpulse-Portable-$V-linux-x64.tar.gz" "Hearthpulse-Portable-$V-linux-arm64.tar.gz"                    "Hearthpulse-$V-linux-x64.AppImage"; do
            test -s "dist/$f" || { echo "::error::dist/$f was not built"; exit 1; }
          done
          for arch in arm64 x64; do
            for ext in pkg dmg zip; do
              f="Hearthpulse-$V-macOS-$arch.$ext"
              test -s "dist/$f" || { echo "::error::dist/$f was not built"; exit 1; }
            done
            test -s "dist/Hearthpulse-Portable-$V-macOS-$arch.zip" || { echo "::error::macOS $arch portable zip was not built"; exit 1; }
          done
      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
          n=$(find . -maxdepth 1 -type f | wc -l)
          [ "$n" -eq "$expected" ] || { echo "::error::$n release files, expected $expected"; exit 1; }
          echo "$n release files"
      # Ed25519 signature of SHA256SUMS.txt (SHA256SUMS.txt.sig) with the UPDATE_SIGNING_KEY secret, checked against the
      # keys the app carries (src/Hearthpulse.Core/Updates/update-signing-key.pub). A release without the secret fails
      # when the app carries a key; a trial run only warns.
      - name: Sign the checksums
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          PUBLISHING: ${{ github.event_name == 'push' || inputs.publish }}
          SIGN_SELFTEST: ${{ inputs.sign_selftest }}
        run: |
          # Once Core embeds the key file (Hearthpulse.Core.csproj names it), a publishing run without the file fails:
          # a deleted or renamed file must not quietly switch the "key embedded, secret missing" rule off.
          if grep -q 'update-signing-key\.pub' src/Hearthpulse.Core/Hearthpulse.Core.csproj; then
            export KEY_FILE_REQUIRED=true
          fi
          bash installer/sign-sums.sh dist src/Hearthpulse.Core/Updates/update-signing-key.pub
          n=$(find dist -maxdepth 1 -type f | wc -l)
          if [ -f dist/SHA256SUMS.txt.sig ]; then want=$((expected + 1)); else want=$expected; fi
          [ "$n" -eq "$want" ] || { echo "::error::$n release files, expected $want"; exit 1; }
          echo "$n release files with the signature"
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || inputs.publish
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Hearthpulse ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: installer/RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
