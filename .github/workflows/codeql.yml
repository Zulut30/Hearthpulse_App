# GitHub CodeQL security analysis of the C# code, on each push to main and once a week (new queries find old code).
# build-mode none analyses the sources without building them, but still restores the NuGet dependencies with the .NET
# SDK, hence setup-dotnet. EnableWindowsTargeting lets that restore take the WPF app (net10.0-windows) on Linux, as
# installer/windows/build.sh does. Results: the repository's Security tab -> Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C#)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      EnableWindowsTargeting: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
