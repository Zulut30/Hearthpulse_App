# GitHub CodeQL security analysis of the C# code, on each push to main and once a week (new queries find old code).
# build-mode none reads the sources without building them: no SDK or restore, and the WPF app is analysed on Linux too.
# Results: the repository's Security tab -> Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C#)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:csharp
