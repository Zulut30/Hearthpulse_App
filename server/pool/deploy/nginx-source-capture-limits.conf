# http{} context, e.g. /etc/nginx/conf.d/hearthpulse-source-capture-limits.conf.
# remote_addr must already be restored only from trusted proxy ranges by the existing origin configuration.
limit_req_zone $binary_remote_addr zone=hearthpulse_stats_write:10m rate=2r/s;
# Public analytics reads have their own budget, so reading cannot use up a client's upload budget or the reverse.
limit_req_zone $binary_remote_addr zone=hearthpulse_stats_read:10m rate=5r/s;
