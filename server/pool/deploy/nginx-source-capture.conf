# P4-selected mount: https://api.kolodahearthstone.com/stats on the EXISTING TLS server.
# P4 owns live edits/reload. Add only these scoped locations; retain all other existing API locations.
# No archive/static alias and no request-body logging. Credentials and identities are in POST bodies only.
# Install deploy/nginx-source-capture-limits.conf in http{} before enabling this include.

location = /stats/v1/captures/reprocess {
    access_log off;
    error_log /dev/null crit;
    return 403;
}

location ^~ /stats/v1/captures/ {
    access_log off;
    error_log /dev/null crit;
    limit_req zone=hearthpulse_stats_write burst=12 nodelay;
    limit_req_status 429;
    client_max_body_size 6m;
    client_body_timeout 30s;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 150s;
    proxy_connect_timeout 3s;
    proxy_set_header Host pool.internal;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    rewrite ^/stats(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3181;
    add_header Cache-Control "no-store" always;
}

location ~ ^/stats/v1/(games|constructed|events|events/forget|events/summary|stats|heroes|choices|meta)$ {
    access_log off;
    error_log /dev/null crit;
    limit_req zone=hearthpulse_stats_write burst=12 nodelay;
    limit_req_status 429;
    client_max_body_size 512k;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host pool.internal;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    rewrite ^/stats(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3181;
    # Source deletion-sensitive summaries must not enter inherited proxy caches.
    proxy_cache off;
}

# Published analytics snapshots (docs/analytics-api.md). Read-only GET; deletion-sensitive, so never proxy-cached.
# No add_header here: it would drop the server block's inherited add_header (HSTS etc.); the service itself
# answers cache-control: no-store, which proxy_pass passes through. Run nginx -t on the host before reload.
location = /stats/v2/analytics/bg/heroes {
    access_log off;
    error_log /dev/null crit;
    limit_except GET { deny all; }
    limit_req zone=hearthpulse_stats_read burst=20 nodelay;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host pool.internal;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    rewrite ^/stats(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3181;
}

location = /stats/healthz {
    access_log off;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    rewrite ^/stats(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3181;
}

location /stats/ { return 404; }
